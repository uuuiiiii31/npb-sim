const vDone2=()=>`${hd()}<div class="c"><b>二人のオーダーが完成!</b><div class="s">投手は同じ能力の架空の選手です。仮試合で勝負しましょう。</div></div>${fin(S.P[0],S.nm[0])}${fin(S.P[1],S.nm[1])}${share()}<div class="bb"><div><button onclick="copy()">書き出す</button><button class="p" onclick="go('match')">仮試合へ</button></div></div>`;

/* ---------- オンライン対戦(部屋コード・PeerJSによる端末間通信) ---------- */
const Net={peer:null,conn:null,open(role,code,cb){const id='stamen-'+code.toLowerCase(),bind=c=>{this.conn=c;c.on('open',()=>cb('joined'));c.on('data',d=>cb('data',d));c.on('close',()=>cb('closed'))};try{if(role=='host'){this.peer=new Peer(id);this.peer.on('open',()=>cb('ready'));this.peer.on('connection',c=>{if(this.conn){c.close();return}bind(c)})}else{this.peer=new Peer();this.peer.on('open',()=>bind(this.peer.connect(id,{reliable:true})))}this.peer.on('error',e=>cb('error',e.type))}catch(e){cb('error','nolib')}},send(o){if(this.conn&&this.conn.open)this.conn.send(o)},close(){try{this.conn&&this.conn.close();this.peer&&this.peer.destroy()}catch(e){}this.conn=null;this.peer=null}};
const ERR={'unavailable-id':'この部屋コードは使われています。別のコードにしてください。','peer-unavailable':'その部屋コードの部屋が見つかりません。コードを確認してください。',nolib:'通信用の部品を読み込めませんでした。インターネットに接続して、開き直してください。'};
const vOnline=()=>`${hd()}<div class="c"><b>オンライン対戦</b><div class="s">2台の端末で、同時に球団を選んでドラフトします。同じ選手を同時に選んだ場合は、抽選で決まり、外れた側は別の選手を選びます(「選べない」設定のとき)。通信できないときは、1台で交互に遊ぶモードをお使いください。</div></div><div class="c"><b>部屋をつくる</b><input id="oc" placeholder="部屋コード(半角英数字4〜8文字)" maxlength="8" autocapitalize="off"><input id="on" value="プレイヤー1" maxlength="10">${exOpt()}<button class="p wide" onclick="hostRoom()">部屋をつくる</button></div><div class="c"><b>部屋に入る</b><input id="jc" placeholder="部屋コード" maxlength="8" autocapitalize="off"><input id="jn" value="プレイヤー2" maxlength="10"><button class="p wide" onclick="joinRoom()">部屋に入る</button></div>${S.err?`<div class="c ng">${S.err}</div>`:''}<div class="bb"><div><button onclick="leave()">もどる</button></div></div>`;
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function leave(){Net.close();S={st:'mode'};draw()}
function netEv(ev,d){if(ev=='ready'){S.net='wait'}else if(ev=='joined'){if(S.me==1)Net.send({k:'join',name:S.nm[1]})}else if(ev=='data'){recv(d);return}else if(ev=='closed'){if(S.st!='done2'&&S.st!='match'&&S.st!='mode'){S.err='接続が切れました。';S.st='err'}}else if(ev=='error'){S.err=ERR[d]||'通信エラーが発生しました('+d+')。';S.st='err'}draw()}
function hostRoom(){const code=val('oc'),nm=val('on')||'プレイヤー1',ex=getEx();if(!/^[A-Za-z0-9]{4,8}$/.test(code)){S.err='部屋コードは、半角英数字4〜8文字にしてください。';return draw()}S=base(3,[nm,'(待機中)'],ex);S.me=0;S.c=0;S.code=code;S.st='lobby';S.joined=0;draw();Net.open('host',code,netEv)}
function joinRoom(){const code=val('jc'),nm=val('jn')||'プレイヤー2';if(!/^[A-Za-z0-9]{4,8}$/.test(code)){S.err='部屋コードは、半角英数字4〜8文字にしてください。';return draw()}S=base(3,['(ホスト)',nm],true);S.me=1;S.c=1;S.code=code;S.st='lobby';draw();Net.open('guest',code,netEv)}
function startOnline(){Net.send({k:'start',ex:S.ex,nm:S.nm});S.st='team';draw()}
const vLobby=()=>`${hd()}<div class="c" style="text-align:center"><div class="s">部屋コード</div><div class="big">${S.code}</div>${S.me==0?(S.joined?`<div class="s"><b>${S.nm[1]}</b> が入室しました。</div><div class="s">選手の重複: ${S.ex?'相手が選んだ選手は選べない':'同じ選手を選べる'}</div><button class="p wide" onclick="startOnline()">ゲームを始める</button>`:'<div class="s">相手が入室するのを待っています。相手に、このコードを伝えてください。</div>'):`<div class="s">部屋に接続しています。接続できたら、ホストの開始を待ちます。</div>`}</div><div class="bb"><div><button onclick="leave()">やめる</button></div></div>`;
const vErr=()=>`${hd()}<div class="c ng">${S.err}</div><div class="bb"><div><button class="p" onclick="leave()">最初にもどる</button></div></div>`;
const vWait=()=>`${hd()}<div class="c" style="text-align:center"><div class="big">⏳</div><div><b>${S.lk?S.lk.n:''}</b> で確定しました。</div><div class="s">相手の確定を待っています…</div></div>`;
const vFin=()=>`${hd()}<div class="c" style="text-align:center"><div class="big">⏳</div><div class="s">あなたのオーダーが完成しました。相手の完成を待っています…</div></div>`;
function lock(){const p=PL.find(x=>x.n==S.sel&&x.t==S.t);S.lk={n:p.n,t:S.t,dest:S.dest,bo:S.bo,pos:S.pp,br:S.br};S.notice='';S.st='wait';draw();if(S.me==0)hostLock(0,{n:p.n,t:S.t});else Net.send({k:'lock',n:p.n,t:S.t})}
function hostLock(i,l){const H=S.H;H.lk[i]=l;const a=H.lk[0],b=H.lk[1];if(!a||!b)return;if(S.ex&&same(a,b)){const lose=Math.floor(Math.random()*2);H.lk[lose]=null;if(lose==0)onReject();else Net.send({k:'reject'})}else{const f={k:'final',p:[{n:a.n,t:a.t},{n:b.n,t:b.t}]};H.lk=[null,null];Net.send(f);onFinal(f)}}
function onReject(){if(!S.lk)return;S.rej.push(S.lk.n+S.lk.t);S.lk=null;S.sel=null;S.st='pick';S.notice='同じ選手を相手も選び、抽選で相手に決まりました。別の選手を選んでください。';draw()}
const pack=P=>({ord:P.ord.map(o=>({n:o.p.n,t:o.t,pos:o.pos})),bn:Object.fromEntries(ROLES.map(r=>[r,{n:P.bn[r].p.n,t:P.bn[r].t}]))});
const unpack=d=>{const P=mkP(),f=x=>PL.find(p=>same(p,x));P.ord=d.ord.map(o=>({p:f(o),t:o.t,pos:o.pos}));ROLES.forEach(r=>{P.bn[r]={p:f(d.bn[r]),t:d.bn[r].t}});return P};
function onFinal(f){const P=S.P[S.me];commit(P,S.lk);S.oppTaken.push(f.p[1-S.me]);S.lk=null;S.rej=[];S.t=null;S.sel=null;S.notice='';if(P.used.length>=12){Net.send({k:'lineup',P:pack(P)});S.st='fin';chk()}else S.st='team';draw();scrollTo(0,0)}
function chk(){if(S.P[S.me].used.length>=12&&S.gotL){S.st='done2';draw()}}
function recv(m){if(m.k=='join'){S.nm[1]=m.name;S.joined=1}else if(m.k=='start'){S.ex=m.ex;S.nm=m.nm;S.st='team'}else if(m.k=='lock'){hostLock(1,{n:m.n,t:m.t});return}else if(m.k=='reject'){onReject();return}else if(m.k=='final'){onFinal(m);return}else if(m.k=='lineup'){S.P[1-S.me]=unpack(m.P);S.gotL=1;chk();return}else if(m.k=='res'){S.res=m.res}draw()}
/* ---------- 仮試合シミュレーター ---------- */
const LG=(()=>{let pa=0,bb=0,so=0,hr=0,h=0,tb=0;PL.filter(p=>p.pa>=100).forEach(p=>{pa+=p.pa;bb+=p.bb;so+=p.so;hr+=p.hr;h+=p.h;tb+=p.slg*p.ab});const d=Math.max(0,tb-h-3*hr);return{bb:bb/pa,so:so/pa,hr:hr/pa,x2:d/pa,x1:(h-hr-d)/pa}})();
const RC=new Map();
function rates(p,unf){const k=p.n+p.t+(unf?1:0);if(RC.has(k))return RC.get(k);const W=120,n=p.has?p.pa:0,tb=p.has?p.slg*p.ab:0,d=Math.max(0,tb-p.h-3*p.hr),s1=Math.max(0,p.h-p.hr-d),f=(x,l)=>(x+W*l)/(n+W),r={bb:f(p.bb,LG.bb),so:f(p.so,LG.so),hr:f(p.hr,LG.hr),x2:f(d,LG.x2),x1:f(s1,LG.x1)};if(unf){r.hr*=.95;r.x2*=.95;r.x1*=.95}RC.set(k,r);return r}
const qv=r=>r.x1+2*r.x2+4*r.hr+.7*r.bb,spd=p=>(p.sb+1)/Math.max(p.g,30),penN=T=>T.sl.filter(s=>s.pos!='DH'&&!s.p.fd[s.pos]).length;
function mkT(P){return{sl:P.ord.map(o=>({p:o.p,pos:o.pos})),ph:P.bn['代打'].p,pr:P.bn['代走'].p,df:P.bn['守備固め'].p,u:{},i:0}}
function pa(r,pen){const x1=r.x1+.009*pen,x2=r.x2+.003*pen;let u=Math.random();if((u-=r.bb)<0)return'BB';if((u-=r.so)<0)return'K';if((u-=r.hr)<0)return'HR';if((u-=x2)<0)return'2B';if((u-=x1)<0)return'1B';return'OUT'}
function dfSub(T){let best=null,g0=0;T.sl.forEach((s,i)=>{if(s.pos=='DH'||!T.df.fd[s.pos])return;const g=gmv(T.df,s.pos)-gmv(s.p,s.pos);if(g>g0){g0=g;best=i}});if(best!==null){T.sl[best].p=T.df;T.u.df=1;return T.sl[best].pos}}
const EV={HR:'本塁打',['2B']:'二塁打',['1B']:'安打',BB:'四球',OUT:'内野ゴロの間'};
function sim(A,B,log){const T=[mkT(A),mkT(B)],tot=[0,0],sc=[[],[]];let inn;
 for(inn=1;inn<=12;inn++){
  for(let h=0;h<2;h++){
   if(h==1&&inn>=9&&tot[1]>tot[0]){sc[1][inn-1]='X';break}
   const bt=T[h],fl=T[1-h],lead=tot[1-h]-tot[h];
   if(inn>=8&&lead>=1&&lead<=3&&!fl.u.df){const ps=dfSub(fl);if(ps&&log)log.push(`${inn}回${h?'表':'裏'} 守備固め: ${fl.df.n}が${PN[ps]}に入る`)}
   let outs=0,b=[-1,-1,-1],run=0;
   while(outs<3){
    const cur=bt.i%9,diff=tot[h]+run-tot[1-h];
    if(inn>=8&&!bt.u.pr&&b[0]>=0&&outs<2&&diff<=0&&diff>=-1&&spd(bt.pr)>spd(bt.sl[b[0]].p)*1.2){const s=bt.sl[b[0]];if(log)log.push(`${inn}回${h?'裏':'表'} 代走: ${bt.pr.n}が${s.p.n}に代わる`);s.p=bt.pr;bt.u.pr=1}
    if(inn>=7&&!bt.u.ph&&outs<2&&(b[1]>=0||b[2]>=0)&&diff<=0&&diff>=-2){const s=bt.sl[cur];if(qv(rates(bt.ph,!bt.ph.fd[s.pos]))>qv(rates(s.p,!s.p.fd[s.pos]))*1.05){if(log)log.push(`${inn}回${h?'裏':'表'} 代打: ${bt.ph.n}が${s.p.n}に代わる`);s.p=bt.ph;bt.u.ph=1}}
    const s=bt.sl[cur],ev=pa(rates(s.p,!s.p.fd[s.pos]),penN(fl));let r0=run;
    if(ev=='K')outs++;
    else if(ev=='OUT'){if(b[0]>=0&&outs<2&&Math.random()<.12){outs+=2;b[0]=-1}else{outs++;if(outs<3&&b[2]>=0&&Math.random()<.3){run++;b[2]=-1}}}
    else if(ev=='BB'){if(b[0]<0)b[0]=cur;else if(b[1]<0){b[1]=b[0];b[0]=cur}else if(b[2]<0){b[2]=b[1];b[1]=b[0];b[0]=cur}else{run++;b[2]=b[1];b[1]=b[0];b[0]=cur}}
    else if(ev=='1B'){const n=[cur,-1,-1];if(b[2]>=0)run++;if(b[1]>=0){if(Math.random()<.55)run++;else n[2]=b[1]}if(b[0]>=0){const pr=Math.min(.5,Math.max(.1,.25+(spd(bt.sl[b[0]].p)-.1)*1.5));if(n[2]<0&&Math.random()<pr)n[2]=b[0];else n[1]=b[0]}b=n}
    else if(ev=='2B'){const n=[-1,cur,-1];if(b[2]>=0)run++;if(b[1]>=0)run++;if(b[0]>=0){if(Math.random()<.4)run++;else n[2]=b[0]}b=n}
    else{run+=1+b.filter(x=>x>=0).length;b=[-1,-1,-1]}
    bt.i++;
    if(log&&run>r0&&(ev=='HR'||run-r0>=2))log.push(`${inn}回${h?'裏':'表'} ${s.p.n}の${EV[ev]}で${run-r0}点 (${tot[0]+(h?0:run)}-${tot[1]+(h?run:0)})`);
    if(h==1&&inn>=9&&tot[1]+run>tot[0])break;
   }
   tot[h]+=run;sc[h][inn-1]=run;
  }
  if(inn>=9&&tot[0]!=tot[1])break;
 }
 return{tot,sc,inn:Math.min(inn,12)}}
function one(){const log=[],g2=sim(S.P[0],S.P[1],log);S.res={one:{...g2,log}};shareRes();draw()}
function shareRes(){if(S.m==3)Net.send({k:'res',res:S.res})}
function many(){let w=0,l=0,t=0,ra=0,rb=0;for(let i=0;i<143;i++){const rv=i%2,g=rv?sim(S.P[1],S.P[0]):sim(S.P[0],S.P[1]),a=g.tot[rv],b=g.tot[1-rv];ra+=a;rb+=b;if(a>b)w++;else if(a<b)l++;else t++}S.res={many:{w,l,t,ra,rb}};shareRes();draw()}
const score=g=>{const n=Math.max(9,g.sc[0].length);return`<div class="sc"><table><tr><th></th>${Array.from({length:n},(_,i)=>`<th>${i+1}</th>`).join('')}<th>計</th></tr>${[0,1].map(h=>`<tr><td>${S.nm[h]}</td>${Array.from({length:n},(_,i)=>`<td>${g.sc[h][i]===undefined?'':g.sc[h][i]}</td>`).join('')}<td><b>${g.tot[h]}</b></td></tr>`).join('')}</table></div>`};
function vMatch(){const A=S.P[0],B=S.P[1],ma=sum(A),mb=sum(B),r=S.res;return`${hd()}<h2>仮試合</h2><div class="c"><div class="s">両チームの投手は、同じ能力の架空の選手です。守備の出場がないポジションに就いた選手は、守備で大幅に不利になり、打撃も少し下がります。代打・代走・守備固めは、試合の終盤に条件が合えば出場します。</div><table><tr><th></th><th>${S.nm[0]}</th><th>${S.nm[1]}</th></tr><tr><td>打率(スタメン)</td><td>${ma.avg}</td><td>${mb.avg}</td></tr><tr><td>長打率</td><td>${ma.slg}</td><td>${mb.slg}</td></tr><tr><td>本塁打</td><td>${ma.hr}</td><td>${mb.hr}</td></tr><tr><td>盗塁</td><td>${ma.sb}</td><td>${mb.sb}</td></tr><tr><td>守備が未経験の人数</td><td class="${ma.unf?'ng':''}">${ma.unf}</td><td class="${mb.unf?'ng':''}">${mb.unf}</td></tr></table></div>${S.m==3&&S.me==1?'<div class="s">試合の実行はホスト(部屋をつくった人)が行い、結果が自動で表示されます。</div>':`<div class="grid"><button class="p" onclick="one()">1試合を見る</button><button class="p" onclick="many()">143試合を実行</button></div>`}${r&&r.one?`<h2>結果</h2><div class="c"><div class="s">${S.nm[0]}(先攻) 対 ${S.nm[1]}(後攻)</div>${score(r.one)}<div class="big">${r.one.tot[0]>r.one.tot[1]?S.nm[0]+'の勝ち':r.one.tot[0]<r.one.tot[1]?S.nm[1]+'の勝ち':'引き分け'}</div>${r.one.log.length?`<div class="s" style="margin-top:6px">${r.one.log.join('<br>')}</div>`:''}</div>`:''}${r&&r.many?`<h2>143試合の結果</h2><div class="c"><div class="big">${r.many.w}勝${r.many.l}敗${r.many.t?r.many.t+'分':''}</div><div class="s" style="text-align:center">${S.nm[0]} の勝率 ${f3(r.many.w/(r.many.w+r.many.l||1))} ・ 平均得点 ${(r.many.ra/143).toFixed(2)} 対 ${(r.many.rb/143).toFixed(2)}(${S.nm[1]})</div><div class="bar"><b style="width:${r.many.w/143*100}%"></b></div><div class="s" style="text-align:center">${r.many.w>r.many.l?S.nm[0]+'のほうが強いオーダーです':r.many.w<r.many.l?S.nm[1]+'のほうが強いオーダーです':'互角のオーダーです'}</div></div>`:''}<div class="bb"><div><button onclick="go('done2')">オーダーにもどる</button><button class="p" onclick="go('mode')">最初にもどる</button></div></div>`}
function draw(){$.innerHTML=S.st=='online'?vOnline():S.st=='lobby'?vLobby():S.st=='err'?vErr():S.st=='wait'?vWait():S.st=='fin'?vFin():S.st=='mode'?vMode():S.st=='turn'?vTurn():S.st=='team'?vTeam():S.st=='pick'?vPick():S.st=='done1'?vDone1():S.st=='done2'?vDone2():vMatch()}
draw();
</script></body></html>
