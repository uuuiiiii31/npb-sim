   const pv=pitcherFor(fl,inn,lead,gi);if(pv&&pv!==fl.cur){fl.cur=pv;note(inn,h,`投手: ${pv.n}${fl.hasP&&fl.rel?'(救援)':'(先発)'}`)}
   let outs=0,b=[-1,-1,-1],run=0;
   while(outs<3){
    const cur=bt.i%9,diff=tot[h]+run-tot[1-h];
    if(inn>=8&&!bt.u.pr&&b[0]>=0&&outs<2&&diff<=0&&diff>=-1&&spd(bt.pr)>spd(bt.sl[b[0]].p)*1.2){const s=bt.sl[b[0]];note(inn,h,`代走: ${bt.pr.n}が${s.p.n}に代わる`);s.p=bt.pr;bt.u.pr=1}
    if(inn>=7&&!bt.u.ph&&outs<2&&(b[1]>=0||b[2]>=0)&&diff<=0&&diff>=-2){const s=bt.sl[cur];if(qv(rates(bt.ph,!bt.ph.fd[s.pos]))>qv(rates(s.p,!s.p.fd[s.pos]))*1.05){note(inn,h,`代打: ${bt.ph.n}が${s.p.n}に代わる`);s.p=bt.ph;bt.u.ph=1}}
    const s=bt.sl[cur],ev=pa(adj(rates(s.p,!s.p.fd[s.pos]),pfac(fl.cur)),penN(fl));let r0=run,tx=ev;
    if(ev=='K')outs++;
    else if(ev=='OUT'){if(b[0]>=0&&outs<2&&Math.random()<.12){outs+=2;b[0]=-1;tx='DP'}else{outs++;if(outs<3&&b[2]>=0&&Math.random()<.3){run++;b[2]=-1}}}
    else if(ev=='BB'){if(b[0]<0)b[0]=cur;else if(b[1]<0){b[1]=b[0];b[0]=cur}else if(b[2]<0){b[2]=b[1];b[1]=b[0];b[0]=cur}else{run++;b[2]=b[1];b[1]=b[0];b[0]=cur}}
    else if(ev=='1B'){const n=[cur,-1,-1];if(b[2]>=0)run++;if(b[1]>=0){if(Math.random()<.55)run++;else n[2]=b[1]}if(b[0]>=0){const pr=Math.min(.5,Math.max(.1,.25+(spd(bt.sl[b[0]].p)-.1)*1.5));if(n[2]<0&&Math.random()<pr)n[2]=b[0];else n[1]=b[0]}b=n}
    else if(ev=='2B'){const n=[-1,cur,-1];if(b[2]>=0)run++;if(b[1]>=0)run++;if(b[0]>=0){if(Math.random()<.4)run++;else n[2]=b[0]}b=n}
    else{run+=1+b.filter(x=>x>=0).length;b=[-1,-1,-1]}
    bt.i++;rec(ids[h],s.p,ev,run-r0);
    if(pb)pb.push({inn,h,bat:s.p.n,pit:fl.cur?fl.cur.n:'架空の投手',ev:tx,runs:run-r0,outs:Math.min(outs,3),sc:[tot[0]+(h?0:run),tot[1]+(h?run:0)]});
    if(h==1&&inn>=9&&tot[1]+run>tot[0])break;
   }
   tot[h]+=run;sc[h][inn-1]=run;if(fl.cur&&fl.cur===fl.sp0)fl.sr+=run;
  }
  if(inn>=9&&tot[0]!=tot[1])break;
 }
 return{tot,sc,inn:Math.min(inn,12),pb}}
const nmOf=i=>S.nm[i],staffTxt=P=>P.sp&&P.sp.length?`先発 ${P.sp.map(p=>p.n).join('・')} ／ 中継ぎ ${(P.rp||[]).map(p=>p.n).join('・')} ／ 守護神 ${P.cl?P.cl.n:'-'}`:'投手: 互角の能力の架空の投手';
function one(){const pb=[],g=sim(S.P[0],S.P[1],{pb,gi:rnd(2)});S.res={one:{g,pb,names:[nmOf(0),nmOf(1)]}};S.pbi=0;shareRes();draw()}
function two(){const g1=sim(S.P[0],S.P[1],{pb:[],gi:0,ids:[0,1]}),g2=sim(S.P[1],S.P[0],{pb:[],gi:1,ids:[1,0]});S.res={two:{g:[g1,g2],names:[[nmOf(0),nmOf(1)],[nmOf(1),nmOf(0)]]}};shareRes();draw()}
function many(){let w=0,l=0,t=0,ra=0,rb=0;const bs={},fat=[[{}],[{}]].map(x=>x[0]);for(let i=0;i<143;i++){const rv=i%2,g=rv?sim(S.P[1],S.P[0],{gi:i,bs,fat:[fat[1],fat[0]],ids:[1,0]}):sim(S.P[0],S.P[1],{gi:i,bs,fat:[fat[0],fat[1]],ids:[0,1]}),a=g.tot[rv],b=g.tot[1-rv];ra+=a;rb+=b;if(a>b)w++;else if(a<b)l++;else t++}S.res={many:{w,l,t,ra,rb,bs:Object.values(bs)}};shareRes();draw()}
function shareRes(){if(S.m==3)Net.send({k:'res',res:S.res})}
function pbStep(n){if(!S.res||!S.res.one)return;S.pbi=Math.min(S.res.one.pb.length,(S.pbi||0)+n);draw()}
const score=(g,nm)=>{const n=Math.max(9,g.sc[0].length);return`<div class="sc"><table><tr><th></th>${Array.from({length:n},(_,i)=>`<th>${i+1}</th>`).join('')}<th>計</th></tr>${[0,1].map(h=>`<tr><td>${nm[h]}</td>${Array.from({length:n},(_,i)=>`<td>${g.sc[h][i]===undefined?'':g.sc[h][i]}</td>`).join('')}<td><b>${g.tot[h]}</b></td></tr>`).join('')}</table></div>`};
const verdict=(g,nm)=>g.tot[0]>g.tot[1]?nm[0]+'の勝ち':g.tot[0]<g.tot[1]?nm[1]+'の勝ち':'引き分け';
const evLine=(e,nm)=>e.note?`<div class="s">　${e.inn}回${e.h?'裏':'表'} ${e.note}</div>`:`<div class="pbl${e.runs?' sc2':''}"><span class="s">${e.inn}回${e.h?'裏':'表'} ${e.outs}アウト</span> <b>${e.bat}</b> ${EVT[e.ev]}${e.runs?` <b>${e.runs}点</b>`:''} <span class="s">(投手 ${e.pit}) ${nm[0]} ${e.sc[0]}-${e.sc[1]} ${nm[1]}</span></div>`;
const bsTable=(L,i)=>{const r=L.filter(x=>x.i==i).sort((a,b)=>b.pa-a.pa);return`<div class="c sc"><b>${S.nm[i]}</b><table><tr><th>選手</th><th>打席</th><th>打率</th><th>本</th><th>点</th><th>四</th><th>三</th></tr>${r.map(x=>`<tr><td>${x.n}</td><td>${x.pa}</td><td>${x.ab?f3(x.h/x.ab):'-'}</td><td>${x.hr}</td><td>${x.rbi}</td><td>${x.bb}</td><td>${x.so}</td></tr>`).join('')}</table></div>`};
function vMatch(){const A=S.P[0],B=S.P[1],ma=sum(A),mb=sum(B),r=S.res,guest=S.m==3&&S.me==1,hasB=A.ord.some(Boolean);
 const rows=hasB?`<tr><td>打率(スタメン)</td><td>${ma.avg}</td><td>${mb.avg}</td></tr><tr><td>長打率</td><td>${ma.slg}</td><td>${mb.slg}</td></tr><tr><td>本塁打</td><td>${ma.hr}</td><td>${mb.hr}</td></tr><tr><td>盗塁</td><td>${ma.sb}</td><td>${mb.sb}</td></tr><tr><td>守備が未経験の人数</td><td class="${ma.unf?'ng':''}">${ma.unf}</td><td class="${mb.unf?'ng':''}">${mb.unf}</td></tr>`:'';
 const one=r&&r.one,pbn=one?one.pb.length:0,shown=one?one.pb.slice(0,S.pbi||0):[],fin=one&&(S.pbi||0)>=pbn;
 return`${hd()}<h2>仮試合</h2><div class="c"><div class="s">${hasB?'守備の出場がないポジションに就いた選手は、守備で大幅に不利になり、打撃も少し下がります。代打・代走・守備固めは、試合の終盤に条件が合えば出場します。':'打線は、両チームとも同じ能力の架空の打者です。'}${A.sp&&A.sp.length?'投手は、選んだ投手が先発・中継ぎ・抑えで起用されます(先発は2人が交互、中継ぎは連投しすぎないように起用)。':'投手は、両チームとも同じ能力の架空の選手です。'}</div><table><tr><th></th><th>${S.nm[0]}</th><th>${S.nm[1]}</th></tr>${rows}<tr><td>投手陣</td><td class="s" style="white-space:normal">${staffTxt(A)}</td><td class="s" style="white-space:normal">${staffTxt(B)}</td></tr></table></div>${guest?'<div class="s">試合の実行はホスト(部屋をつくった人)が行い、結果が自動で表示されます。</div>':`<div class="grid"><button class="p" onclick="one()">1試合を実況で見る</button><button class="p" onclick="two()">2試合セット(先攻・後攻を入れ替え)</button></div><button class="p wide" onclick="many()">143試合を実行(打者の成績つき)</button>`}
 ${one?`<h2>実況</h2><div class="c"><div class="s">${one.names[0]}(先攻) 対 ${one.names[1]}(後攻)</div><div class="chips"><button onclick="pbStep(1)" ${fin?'disabled':''}>次の打席</button><button onclick="pbStep(10)" ${fin?'disabled':''}>10打席進める</button><button onclick="pbStep(9999)" ${fin?'disabled':''}>最後まで</button></div>${shown.length?shown.map(e=>evLine(e,one.names)).join(''):'<div class="s">「次の打席」を押すと、1打席ずつ表示されます。</div>'}${fin?`${score(one.g,one.names)}<div class="big">${verdict(one.g,one.names)}</div>`:''}</div>`:''}
 ${r&&r.two?`<h2>2試合セットの結果</h2>${r.two.g.map((g,i)=>`<div class="c"><div class="s">第${i+1}試合 ${r.two.names[i][0]}(先攻)</div>${score(g,r.two.names[i])}<div class="s">${verdict(g,r.two.names[i])}</div></div>`).join('')}<div class="c"><div class="big">${(()=>{const a=r.two.g[0].tot[0]+r.two.g[1].tot[1],b=r.two.g[0].tot[1]+r.two.g[1].tot[0];return a>b?S.nm[0]+'の勝ち':a<b?S.nm[1]+'の勝ち':'引き分け'})()}</div><div class="s" style="text-align:center">合計得点 ${S.nm[0]} ${r.two.g[0].tot[0]+r.two.g[1].tot[1]} - ${r.two.g[0].tot[1]+r.two.g[1].tot[0]} ${S.nm[1]}</div></div>`:''}
 ${r&&r.many?`<h2>143試合の結果</h2><div class="c"><div class="big">${r.many.w}勝${r.many.l}敗${r.many.t?r.many.t+'分':''}</div><div class="s" style="text-align:center">${S.nm[0]} の勝率 ${f3(r.many.w/(r.many.w+r.many.l||1))} ・ 平均得点 ${(r.many.ra/143).toFixed(2)} 対 ${(r.many.rb/143).toFixed(2)}(${S.nm[1]})</div><div class="bar"><b style="width:${r.many.w/143*100}%"></b></div><div class="s" style="text-align:center">${r.many.w>r.many.l?S.nm[0]+'のほうが強いオーダーです':r.many.w<r.many.l?S.nm[1]+'のほうが強いオーダーです':'互角のオーダーです'}</div></div>${bsTable(r.many.bs,0)}${bsTable(r.many.bs,1)}`:''}
 <div class="bb"><div><button onclick="go('done2')">オーダーにもどる</button><button class="p" onclick="go('mode')">最初にもどる</button></div></div>`}
function draw(){$.innerHTML=S.st=='pit'?vPit():S.st=='online'?vOnline():S.st=='lobby'?vLobby():S.st=='err'?vErr():S.st=='wait'?vWait():S.st=='fin'?vFin():S.st=='mode'?vMode():S.st=='turn'?vTurn():S.st=='team'?vTeam():S.st=='pick'?vPick():S.st=='done1'?vDone1():S.st=='done2'?vDone2():vMatch()}
draw();
</script></body></html>
